<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Turf - Futuristic Technology Marketplace</title>

    <link rel="stylesheet" href="/src/css/tailwind.generated.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/src/css/pages/style.css">
    <link rel="stylesheet" href="/src/css/pages/shop-styles.css">
    <style>
        /* --- Advanced Filter Categories Dropdown Styles --- */
        .features-dropdown-menu {
            position: absolute;
            top: calc(100% + 12px);
            right: 0;
            width: 650px;
            max-height: 600px;
            background: rgba(8, 14, 38, 0.98);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            z-index: 1000; /* Extremely high to stay on top */
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 40px rgba(210, 103, 14, 0.1);
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px) scale(0.98);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        .features-dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .category-accordion {
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 16px;
        }

        .category-accordion:last-child {
            border-bottom: none;
        }

        .accordion-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 8px 0;
            width: 100%;
            background: none;
            border: none;
            outline: none;
        }

        .accordion-trigger h2 {
            font-size: 14px;
            font-weight: 800;
            color: #fb923c;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .accordion-content {
            display: none;
            padding-top: 16px;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .accordion-content.active {
            display: grid;
        }

        .subcategory-group {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
        }

        .subcategory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .subcategory-title {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .select-all-btn {
            font-size: 10px;
            color: #d2670e;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .select-all-btn:hover {
            opacity: 1;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 6px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid transparent;
        }

        .option-label:hover {
            background: rgba(210, 103, 14, 0.1);
            color: white;
            border-color: rgba(210, 103, 14, 0.2);
        }

        .option-label input {
            accent-color: #d2670e;
            width: 15px;
            height: 15px;
        }

        .dropdown-footer {
            position: sticky;
            bottom: -24px;
            margin: 24px -24px -24px;
            padding: 24px;
            background: rgba(10, 15, 30, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .features-search-container {
            position: sticky;
            top: -24px;
            margin: -24px -24px 20px;
            padding: 24px;
            background: rgba(8, 14, 38, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 50;
        }

        .features-search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 12px 16px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .features-search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: #d2670e;
            box-shadow: 0 0 15px rgba(210, 103, 14, 0.15);
        }

        .features-dropdown-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.25rem;
            padding: 0 1.5rem;
            color: white;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
            outline: none;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .features-dropdown-trigger:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(210, 103, 14, 0.3);
            box-shadow: 0 0 20px rgba(210, 103, 14, 0.1);
        }

        .features-dropdown-trigger.active {
            background: rgba(210, 103, 14, 0.15);
            border-color: #d2670e;
        }

        @media (max-width: 1024px) {
            .features-dropdown-menu {
                width: 500px;
            }
        }

        @media (max-width: 768px) {
            .features-dropdown-menu {
                width: calc(100vw - 32px);
                left: 0;
                right: 0;
                margin: auto;
                max-height: 80vh;
            }
            .accordion-content {
                grid-template-columns: 1fr;
            }
        }

    </style>
    <script src="/src/js/features/shop-logic.js"></script>
    <script src="/src/js/core/layout.js" defer></script>
</head>


<body data-page="Shop" class="shop-branding">
    <div id="header-container"></div>

    <!-- Hero Section -->
    <section class="shop-hero py-16 lg:py-24 relative overflow-hidden bg-[#05080f]">
        <div class="absolute inset-0 bg-gradient-to-b from-orange-500/10 to-transparent"></div>
        <div class="max-w-7xl mx-auto px-4 relative z-10 text-center">
            <span class="text-orange-500 font-mono tracking-widest text-xs uppercase block mb-4">Discover the Future</span>
            <h1 class="text-4xl md:text-6xl font-black text-white uppercase tracking-tighter mb-6">Tech Turf <span class="text-orange-500">Marketplace</span></h1>
            <p class="text-gray-400 max-w-2xl mx-auto text-lg font-light mb-8">Explore high-end digital modules, aerospace components, and viral growth systems engineered for excellence.</p>
            
            <!-- Custom Website Builder CTA -->
            <a href="custom-website-builder.html" class="inline-flex items-center justify-center gap-3 bg-gradient-to-r from-orange-600 to-orange-400 hover:from-orange-500 hover:to-orange-300 text-white px-8 py-4 rounded-full font-black uppercase tracking-widest text-sm transition-all shadow-lg shadow-orange-500/25 hover:shadow-orange-500/40 hover:-translate-y-1">
                <i data-lucide="layout-template" class="w-5 h-5"></i>
                Custom Website Builder
            </a>
        </div>
    </section>

    <section class="product-section py-8 relative z-10">
        <div class="shop-container max-w-[1600px] mx-auto px-4 flex flex-col lg:flex-row gap-10">
            
            <!-- Main Content -->
            <main class="flex-1 min-w-0">
                <div class="mb-10">
                    <div id="selected-features-chips" class="features-chips-container mt-6 flex flex-wrap gap-3"></div>
                </div>

            <div id="products-grid" class="product-grid"></div>

            <section id="recent-section" class="mt-16 hidden">
                <div class="section-head mb-8">
                    <div>
                        <span class="text-orange-500 font-mono tracking-widest text-xs uppercase mb-2 block">Quick Access</span>
                        <h3 class="text-2xl md:text-3xl font-black text-white uppercase tracking-tighter">Recently Viewed</h3>
                    </div>
                </div>
                <div id="recent-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </section>
            </main>
        </div>
    </section>

    <div id="compare-bar" class="hidden fixed bottom-10 left-1/2 -translate-x-1/2 z-[120] bg-black/60 border border-white/20 rounded-full px-4 py-3 backdrop-blur-2xl flex items-center gap-4 shadow-2xl shadow-orange-500/20 transform transition-all hover:scale-105">
        <div class="flex items-center gap-3">
            <div id="compare-thumbnails" class="flex -space-x-3"></div>
            <span id="compare-count" class="text-xs text-white uppercase tracking-widest font-bold ml-2">Compare (0)</span>
        </div>
        <div class="h-6 w-px bg-white/20"></div>
        <button id="compare-go" class="px-5 py-2 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 text-white text-xs font-black uppercase tracking-widest disabled:opacity-50 disabled:from-gray-600 disabled:to-gray-700 transition-all shadow-lg hover:shadow-orange-500/50">Compare Now</button>
    </div>

    <div id="footer-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {

            const productsGrid = document.getElementById('products-grid');
            const productCount = document.getElementById('product-count');
            const searchInput = document.getElementById('search-input');
            const recentSection = document.getElementById('recent-section');
            const recentGrid = document.getElementById('recent-grid');
            let recentProductsCache = [];
            let recentProductsLoaded = false;
            let recentProductsLoading = null;

            if (productCount) productCount.textContent = 'Loading Inventory...';

            // Skeleton loaders
            const renderSkeletons = () => {
                if (!productsGrid) return;
                productsGrid.innerHTML = Array(6).fill(0).map(() => `
                    <div class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden animate-pulse">
                        <div class="aspect-square bg-white/5"></div>
                        <div class="p-5">
                            <div class="h-4 bg-white/10 rounded w-1/3 mb-4"></div>
                            <div class="h-6 bg-white/10 rounded w-3/4 mb-3"></div>
                            <div class="h-3 bg-white/10 rounded w-full mb-2"></div>
                            <div class="h-3 bg-white/10 rounded w-5/6 mb-6"></div>
                            <div class="flex justify-between">
                                <div class="h-8 bg-white/10 rounded w-1/3"></div>
                                <div class="h-8 bg-white/10 rounded w-1/4"></div>
                            </div>
                        </div>
                    </div>
                `).join('');
            };
            renderSkeletons();


            const state = {
                products: [],
                filtered: [],
                currentPage: 1,
                itemsPerPage: 100, // Show all products since pagination is removed
                search: '',
                category: 'all',
                wishlist: new Set((window.getWishlistIds ? window.getWishlistIds() : []).map(String)),
                compare: new Set((window.getCompareIds ? window.getCompareIds() : []).map(String)),
            };



            const productMap = new Map();

            const fetchAndInitializeProducts = async () => {
                const allProducts = await window.fetchProducts();
                state.products = allProducts;
                state.filtered = allProducts;
                
                if (productCount) productCount.textContent = `${allProducts.length} Units Available`;
                
                allProducts.forEach((product) => {
                    const productId = product._id || product.id;
                    if (productId) productMap.set(String(productId), product);
                });

                // Brand Select was removed from UI

                render();
            };

            fetchAndInitializeProducts();

            const getStock = (product) => Number(product.stock || product.countInStock || 0);

            const renderStars = (rating) => {
                const rounded = Math.round(Number(rating || 0));
                const stars = [];
                for (let i = 1; i <= 5; i += 1) {
                    stars.push(`<span class="${i <= rounded ? 'text-yellow-400' : 'text-white/20'}">★</span>`);
                }
                return stars.join('');
            };

            const renderProduct = (product) => {
                const stockCount = getStock(product);
                const productId = product._id || product.id;
                const isWishlisted = productId ? state.wishlist.has(String(productId)) : false;
                const isCompared = productId ? state.compare.has(String(productId)) : false;
                const wishlistClass = isWishlisted ? 'text-red-400 border-red-400/40' : 'text-white/50 border-white/10';
                const compareClass = isCompared ? 'text-blue-400 border-blue-400/40' : 'text-white/50 border-white/10';
                const imageUrl = window.normalizeProductImageUrl
                    ? window.normalizeProductImageUrl(product.imageUrl || (product.images && product.images[0]) || product.image_url || product.image)
                    : (product.imageUrl || (product.images && product.images[0]) || product.image_url || product.image || '/public/images/space-bg.png');

                return `
                <div class="product-card group relative bg-black/40 border border-white/10 rounded-2xl overflow-hidden backdrop-blur-md hover:border-orange-500/50 hover:shadow-2xl hover:shadow-orange-500/20 hover:-translate-y-1 transition-all duration-300" data-category="${product.branch || product.category || 'Tech Turf'}" data-product-id="${productId || ''}">
                    <!-- Card Background Glow -->
                    <div class="absolute -inset-0.5 bg-gradient-to-br from-orange-500/0 via-transparent to-blue-500/0 group-hover:from-orange-500/20 group-hover:to-blue-500/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-2xl z-0 pointer-events-none"></div>
                    
                    <div class="relative z-10">
                        <div class="absolute top-3 right-3 flex flex-col gap-2 z-20 translate-x-12 opacity-0 group-hover:translate-x-0 group-hover:opacity-100 transition-all duration-300">
                            <button class="wishlist-btn w-10 h-10 rounded-full border ${wishlistClass} bg-black/60 backdrop-blur-md flex items-center justify-center hover:bg-black/80 hover:scale-110 transition-all" data-product-id="${productId || ''}" aria-label="Toggle wishlist">
                                <i data-lucide="heart" class="w-4 h-4"></i>
                            </button>
                            <button class="compare-btn w-10 h-10 rounded-full border ${compareClass} bg-black/60 backdrop-blur-md flex items-center justify-center hover:bg-black/80 hover:scale-110 transition-all" data-product-id="${productId || ''}" aria-label="Toggle compare">
                                <i data-lucide="columns" class="w-4 h-4"></i>
                            </button>
                        </div>
                        <div class="aspect-square bg-black/40 relative overflow-hidden">
                            <img src="${imageUrl}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-110 group-hover:rotate-1 transition-transform duration-700 ease-out">
                            
                            <div class="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black via-black/80 to-transparent translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out">
                                <button
                                    ${stockCount > 0 ? '' : 'disabled'}
                                    class="add-to-cart-btn ${stockCount > 0 ? 'bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-400 hover:to-orange-500 text-white cursor-pointer shadow-lg shadow-orange-500/30' : 'bg-white/10 text-white/40 cursor-not-allowed'} w-full py-3 rounded-xl font-black uppercase text-[10px] tracking-widest transition-all"
                                    data-product-id="${productId || ''}">
                                    ${stockCount > 0 ? 'Add to Cart' : 'Out of Stock'}
                                </button>
                            </div>
                        </div>
                        <div class="p-5">
                            <div class="flex items-center justify-between text-[10px] text-white/50 uppercase tracking-widest mb-2">
                                <span class="bg-white/10 px-2 py-1 rounded border border-white/5">${product.brand || 'Tech Turf'}</span>
                                <span class="flex items-center gap-1 text-yellow-400"><i data-lucide="star" class="w-3 h-3 fill-current"></i> ${Number(product.ratingAvg || 0).toFixed(1)}</span>
                            </div>
                            <h3 class="text-white font-bold text-base leading-tight group-hover:text-orange-400 transition-colors mb-1 line-clamp-1" title="${product.name}">${product.name}</h3>
                            <p class="text-gray-400 text-xs line-clamp-2 mb-4 min-h-[32px]">${product.description}</p>
                            
                            <div class="flex items-end justify-between mt-auto">
                                <div>
                                    <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Price</div>
                                    <div class="text-white font-mono font-bold text-lg">₹${product.price}</div>
                                </div>
                                <div class="text-right">
                                    <div class="flex items-center justify-end gap-1.5 text-[10px] uppercase tracking-widest ${stockCount > 0 ? 'text-emerald-400' : 'text-red-400'} mb-1">
                                        <div class="w-1.5 h-1.5 rounded-full ${stockCount > 0 ? 'bg-emerald-400 animate-pulse' : 'bg-red-400'}"></div>
                                        ${stockCount > 0 ? 'In Stock' : 'Out of Stock'}
                                    </div>
                                    <div class="text-[9px] text-gray-500 uppercase tracking-widest">ETA ${Number(product.deliveryEtaDays || 3)} Days</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            };

            const renderPagination = () => {
                // Pagination removed as per UI simplification
            };

            const updateCompareBar = () => {
                const count = state.compare.size;
                const compareBar = document.getElementById('compare-bar');
                const compareCount = document.getElementById('compare-count');
                const compareGo = document.getElementById('compare-go');
                const compareThumbnails = document.getElementById('compare-thumbnails');

                if (count === 0) {
                    compareBar.classList.add('hidden');
                } else {
                    compareBar.classList.remove('hidden');
                    
                    // Render thumbnails
                    compareThumbnails.innerHTML = Array.from(state.compare).slice(0, 3).map(id => {
                        const product = productMap.get(id);
                        if (!product) return '';
                        const imageUrl = window.normalizeProductImageUrl
                            ? window.normalizeProductImageUrl(product.imageUrl || (product.images && product.images[0]) || product.image_url || product.image)
                            : (product.imageUrl || (product.images && product.images[0]) || product.image_url || product.image || '/public/images/space-bg.png');
                        return `<img src="${imageUrl}" class="w-8 h-8 rounded-full border-2 border-black object-cover bg-black shadow-sm" alt="Compare item">`;
                    }).join('') + (count > 3 ? `<div class="w-8 h-8 rounded-full border-2 border-black bg-gray-800 flex items-center justify-center text-[10px] text-white shadow-sm">+${count - 3}</div>` : '');
                }
                compareCount.textContent = `Compare (${count})`;
                if (compareGo) {
                    compareGo.disabled = count < 2;
                    compareGo.classList.toggle('cursor-not-allowed', count < 2);
                }
            };

            const applyFilters = () => {
                const search = state.search.trim().toLowerCase();

                state.filtered = state.products.filter((product) => {
                    const name = (product.name || '').toLowerCase();
                    const desc = (product.description || '').toLowerCase();
                    const matchesSearch = !search || name.includes(search) || desc.includes(search);

                    const category = product.branch || product.category || 'Tech Turf';
                    const matchesCategory = state.category === 'all' || category === state.category;

                    return matchesSearch && matchesCategory;
                });
            };

            const renderRecent = () => {
                if (!recentSection || !recentGrid) return;

                if (!window.getAuthToken || !window.getAuthToken()) {
                    recentSection.classList.add('hidden');
                    recentGrid.innerHTML = '';
                    return;
                }

                if (!recentProductsLoaded) {
                    if (!recentProductsLoading) {
                        recentProductsLoading = (async () => {
                            try {
                                const token = window.getAuthToken();
                                const response = await fetch(`${window.API_BASE_URL}/orders/myorders`, {
                                    headers: { 'Authorization': `Bearer ${token}` }
                                });

                                if (!response.ok) {
                                    recentProductsCache = [];
                                    return;
                                }

                                const orders = await response.json();
                                const seen = new Set();
                                const collected = [];

                                (Array.isArray(orders) ? orders : []).forEach((order) => {
                                    const items = Array.isArray(order.orderItems) ? order.orderItems : Array.isArray(order.items) ? order.items : [];
                                    items.forEach((item) => {
                                        const productId = item._id || item.id || item.productId || item.product_id;
                                        const key = productId ? String(productId) : '';
                                        if (!key || seen.has(key)) return;
                                        seen.add(key);
                                        const liveProduct = productMap.get(key) || item;
                                        collected.push(liveProduct);
                                    });
                                });

                                recentProductsCache = collected.slice(0, 6);
                            } catch (error) {
                                console.error('Failed to load recent products from orders:', error);
                                recentProductsCache = [];
                            } finally {
                                recentProductsLoaded = true;
                                recentProductsLoading = null;
                                renderRecent();
                            }
                        })();
                    }
                    recentSection.classList.add('hidden');
                    return;
                }

                if (recentProductsCache.length === 0) {
                    recentSection.classList.add('hidden');
                    recentGrid.innerHTML = '';
                    return;
                }

                recentSection.classList.remove('hidden');
                recentGrid.innerHTML = recentProductsCache.map(renderProduct).join('');
            };

            const render = () => {
                applyFilters();

                const total = state.filtered.length;
                if (productCount) productCount.textContent = `${total} Units Available`;

                const start = (state.currentPage - 1) * state.itemsPerPage;
                const end = start + state.itemsPerPage;
                const pageItems = state.filtered.slice(start, end);

                productsGrid.innerHTML = pageItems.length
                    ? pageItems.map(renderProduct).join('')
                    : '<p class="text-white text-center col-span-full">No products found.</p>';

                renderPagination();
                renderRecent();
                updateCompareBar();

                if (window.lucide) lucide.createIcons();
            };

            const addProductToCart = (productId, qty) => {
                const product = productMap.get(String(productId));
                if (!product) return;
                const quantity = Math.max(1, Number(qty || 1));
                for (let i = 0; i < quantity; i += 1) {
                    window.addToCart(product);
                }
            };

            productsGrid.addEventListener('click', (event) => {
                const target = event.target.closest('button');
                if (!target) return;

                const productId = target.dataset.productId;
                if (!productId) return;

                if (target.classList.contains('add-to-cart-btn')) {
                    addProductToCart(productId, 1);
                }

                if (target.classList.contains('quick-add-btn')) {
                    const qtyInput = productsGrid.querySelector(`.qty-input[data-product-id="${productId}"]`);
                    addProductToCart(productId, qtyInput ? qtyInput.value : 1);
                }

                if (target.classList.contains('wishlist-btn')) {
                    const key = String(productId);
                    if (state.wishlist.has(key)) {
                        state.wishlist.delete(key);
                    } else {
                        state.wishlist.add(key);
                    }
                    if (window.saveWishlistIds) {
                        window.saveWishlistIds(Array.from(state.wishlist));
                    }
                    if (window.updateWishlistDisplay) window.updateWishlistDisplay();
                    render();
                }

                if (target.classList.contains('compare-btn')) {
                    const key = String(productId);
                    if (state.compare.has(key)) {
                        state.compare.delete(key);
                    } else {
                        state.compare.add(key);
                    }
                    if (window.saveCompareIds) {
                        window.saveCompareIds(Array.from(state.compare));
                    }
                    updateCompareBar();
                    render();
                }
            });

            const debounce = (func, delay) => {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), delay);
                };
            };

            const handleFilterChange = async () => {
                state.search = searchInput ? searchInput.value || '' : '';
                state.currentPage = 1;
                
                // Optional: Re-fetch from server if you want server-side filtering
                // const products = await window.fetchProducts(state.search, state.category);
                // state.products = products;
                
                render();
            };

            const debouncedFilterChange = debounce(handleFilterChange, 300);

            if (searchInput) searchInput.addEventListener('input', debouncedFilterChange);

            if (window.addEventListener) {
                window.addEventListener('wishlistUpdated', () => {
                    state.wishlist = new Set((window.getWishlistIds ? window.getWishlistIds() : []).map(String));
                    render();
                });
                window.addEventListener('compareUpdated', () => {
                    state.compare = new Set((window.getCompareIds ? window.getCompareIds() : []).map(String));
                    updateCompareBar();
                    render();
                });
            }

            // clearFiltersBtn removed from UI


            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.category = btn.dataset.category;
                    state.currentPage = 1;
                    render();
                });
            });

            compareGo.addEventListener('click', () => {
                const ids = Array.from(state.compare);
                if (ids.length < 2) {
                    window.showMessage('info', 'Select at least two products to compare.');
                    return;
                }
                window.location.href = `compare.html?ids=${ids.join(',')}`;
            });

            // Initial brand rendering moved to fetchAndInitializeProducts

            render();
        });
    </script>

    <!-- 🛒 SHOP QUICK CONTROLS (Always Visible) -->
    <div class="shop-floating-controls reveal-hidden">
        <a href="wishlist.html" class="shop-control-btn transition-link">
            <i data-lucide="heart"></i>
            <span>Wishlist</span>
            <div class="wishlist-count count-badge hidden">0</div>
        </a>
        <a href="cart.html" class="shop-control-btn transition-link">
            <i data-lucide="shopping-bag"></i>
            <span>Cart</span>
            <div class="cart-count count-badge hidden">0</div>
        </a>
    </div>

    <style>
        /* Trigger reveal animation for the bar immediately or via scroll */
        .shop-floating-controls.reveal-hidden {
             opacity: 1;
             visibility: visible;
        }
    </style>
</body>
